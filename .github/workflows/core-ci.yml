name: Nikky Core CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nikky
          POSTGRES_PASSWORD: nikky-ci-password
          POSTGRES_DB: nikky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nikky -d nikky"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nikky:nikky-ci-password@127.0.0.1:5432/nikky
      NODE_ENV: test
      NIKKY_SERVICE_TOKEN: pppppppppppppppppppppppppppppppppppppppp
      NIKKY_MEMORY_KEY: mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm
      NIKKY_SESSION_SECRET: ssssssssssssssssssssssssssssssssssssssss
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node tests/postgres.integration.test.js


  native-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check desktop Rust client
        run: cargo check --manifest-path clients/desktop/src-tauri/Cargo.toml

  native-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test iOS Swift package
        run: swift test --package-path clients/ios

  native-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Compile Android debug app
        working-directory: clients/android
        run: gradle :app:assembleDebug --no-daemon


  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production container
        run: docker build -f deploy/Dockerfile -t nikky-ci .
